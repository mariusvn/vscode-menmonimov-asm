name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish .vsix
    runs-on: windows-latest

    steps:
      - name: Checkout (with LSP submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build language server (Release)
        run: npm run build-lsp

      - name: Package .vsix
        run: npx @vscode/vsce package --out mnemonimov-asm.vsix

      - name: Attach .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: mnemonimov-asm.vsix
          generate_release_notes: true
